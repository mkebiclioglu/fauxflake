[project]
name = "fauxflake"
version = "0.2.0"
description = "Run dbt-snowflake CI on synthetic, statistically shaped data, locally on DuckDB."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "dbt-core>=1.10",
    "dbt-snowflake>=1.10",
    "duckdb>=2.0.0",
    # fauxflake patches the emulator's internals, so the minor version is pinned
    "fakesnow[server]>=0.12.1,<0.13",
    "pyyaml>=6.0",
    "snowflake-connector-python<5",
    "sqlglot>=30",
]

[project.scripts]
fauxflake = "fauxflake.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fauxflake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]

[tool.hatch.build.targets.wheel.force-include]
"conformance" = "fauxflake/conformance_cases"
