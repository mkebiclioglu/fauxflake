- {id: window_values, sql: "select x, first_value(x) over (order by x), last_value(x) over (order by x), nth_value(x, 2) over (order by x), lead(x, 1, -1) over (order by x), lag(x, 2) over (order by x) from (select column1 x from values (1), (2), (3)) order by 1"}
- {id: window_default_frame, sql: "select x, sum(x) over (order by g), count(*) over (order by g), max(x) over (partition by g), sum(x) over () from (select column1 x, column2 g from values (1, 'a'), (2, 'a'), (3, 'b')) order by 1"}
- {id: window_range_frame, sql: "select x, sum(x) over (order by x range between 1 preceding and 1 following), avg(x) over (order by x rows between unbounded preceding and unbounded following) from (select column1 x from values (1), (2), (4)) order by 1"}
- {id: set_ops, sql: "select * from (select 1 x union select 1 union all select 2 minus select 2) order by 1"}
- {id: intersect_except, sql: "select * from (select column1 x from values (1), (2), (2) intersect select column1 from values (2), (3) union all select column1 from values (5), (6) except select 6) order by 1"}
- {id: recursive_cte, sql: "with recursive r as (select 1 n union all select n + 1 from r where n < 5) select sum(n), count(*) from r"}
- {id: grouping_sets, sql: "select g, h, sum(x), grouping(g) from (select column1 g, column2 h, column3 x from values ('a', 'p', 1), ('a', 'q', 2), ('b', 'p', 3)) group by rollup (g, h) order by 1 nulls last, 2 nulls last"}
- {id: group_by_alias_position, sql: "select upper(g) as gg, count(*) c from (select column1 g from values ('a'), ('A'), ('b')) group by gg having c > 1 order by 1"}
- {id: lateral_alias_reuse, sql: "select x * 2 as double_x, double_x + 1 as plus_one from (select 5 x)"}
- {id: select_exclude_rename, sql: "select * exclude (b) rename (a as aa) from (select 1 a, 2 b, 3 c)"}
- {id: values_join_using, sql: "select id, l.v, r.w from (select column1 id, column2 v from values (1, 'a'), (2, 'b')) l full outer join (select column1 id, column2 w from values (2, 'x'), (3, 'y')) r using (id) order by 1"}
- {id: asof_join, sql: "select t.ts, q.price from (select column1 ts from values (5), (15)) t asof join (select column1 ts, column2 price from values (1, 10), (10, 20)) q match_condition (t.ts >= q.ts) order by 1"}
- {id: quoted_identifiers, sql: "select \"MixedCase\", lower_case, UPPER_CASE from (select 1 as \"MixedCase\", 2 as lower_case, 3 as UPPER_CASE)"}
- {id: sample_generator_seq, sql: "select count(*), min(n), max(n) from (select row_number() over (order by seq4()) n from table(generator(rowcount => 100)))"}
- {id: top_limit_offset, sql: "select top 2 x from (select column1 x from values (3), (1), (2)) order by x"}
- {id: qualify_rank_filter, sql: "select g, x from (select column1 g, column2 x from values ('a', 1), ('a', 2), ('b', 5)) qualify x = max(x) over (partition by g) order by 1"}
- {id: count_if_filter, sql: "select count_if(x > 1), sum(iff(x > 1, 1, 0)), count(case when x > 1 then 1 end), boolor_agg(x is null) from (select column1 x from values (1), (2), (null))"}
- {id: zero_pad_format, sql: "select to_varchar(42, '0000'), to_char(1234567.891, '9,999,999.99'), to_char(5, 'FM999'), to_varchar(0.5, '0.00'), lpad(7::string, 3, '0')"}
- {id: boolean_strings, sql: "select true::string, false::varchar, to_varchar(true), 'TRUE'::boolean, try_to_boolean('maybe'), iff(to_boolean('0'), 'y', 'n')"}
- {id: number_to_string, sql: "select 1.50::string, 1.0::string, (1/3)::string, 100::float::string, 1e10::string, 0.1::float::string, 12345678901234567890::string"}
- {id: null_timestamps, sql: "select null::timestamp, null::date, null::time, x, try_to_timestamp('nope'), try_to_date('nope') from (select column1::timestamp x from values ('2025-01-01'), (null)) order by x"}
- {id: decimal_to_string, sql: "select 3::number(10,2)::string, 'a' || x, x::varchar, to_varchar(x), concat(x, '|'), 2.5::float::string from (select 1.50::number(10,2) x)"}
- {id: window_avg_scale, sql: "select avg(x) over (), avg(y) over (), avg(z) over (partition by x), avg(f) over () from (select column1 x, column2::number(12,2) y, column3::number(12,5) z, column4::float f from values (1, 1.5, 1.5, 1.5), (2, 2.25, 1, 2), (4, 0.1, 1, 4)) order by x limit 1"}
- {id: agg_scales, sql: "select variance(x), variance(y), variance(f), var_pop(z), avg(z), avg(f), sum(y), sum(x), sum(f) from (select column1 x, column2::number(12,2) y, column3::number(12,5) z, column4::float f from values (1, 1.5, 1.5, 1.5), (2, 2.25, 1, 2), (4, 0.1, 1, 4))"}
- {id: to_char_column, sql: "select to_char(d, 'YYYYMMDD'), to_char(d, 'YYYY-MM'), to_char(t, 'YYYY-MM-DD HH24:MI'), to_varchar(d, 'DD/MM/YYYY'), to_char(d, 'YYYYMMDD')::int from (select '2025-03-04'::date d, '2025-03-04 15:06:07'::timestamp t)"}
- {id: hash_numbers, sql: "select md5(42), md5(1.5), md5(x), sha2(x), md5(d) from (select 7 x, '2025-03-04'::date d)"}
- {id: null_division, sql: "select null / 0, x / nullif(y, 0), div0(x, y), sum(x) / nullif(count(z), 0) from (select 1 x, 0 y, null::int z)"}
- {id: try_timestamps, sql: "select try_to_timestamp_ntz('2025-01-01 00:00:00'), to_timestamp_ntz('2025-01-01'), try_to_timestamp('2025-01-01', 'YYYY-MM-DD'), try_to_timestamp('x', 'YYYY-MM-DD'), try_to_date('31/12/2025', 'DD/MM/YYYY'), try_to_number('1x'), try_to_decimal('1.5', 10, 2)"}
- {id: get_and_compare, sql: "select get(a, 2) = 'c', get(a, 1)::string, get(a, 2) not in ('x'), get(a, 0) like 'a%', get(o, 'k')::string, a[1]::string = 'b', a[0] = 'a', o['k'] = 'v', o:k in ('v', 'w'), get(a, 9) is null from (select split('a b c', ' ') a, object_construct('k', 'v') o)"}
- {id: variant_predicates, sql: "select count(*) from (select parse_json(column1) v from values ('{\"t\": \"run\", \"n\": 3}'), ('{\"t\": \"add\", \"n\": 5}')) where v:t = 'run' or (v:n > 4 and v:t like 'a%' and v:t <> 'x')"}
