- {id: window_alias_inside_window_with_join, sql: "with p as (select 1 id, 'u' uuid, '2025-01-01'::timestamp created, '2025-01-02'::timestamp uploaded, '2025-01-01'::date d union all select 2, 'u', '2025-01-03'::timestamp, '2025-01-04'::timestamp, '2025-01-03'::date), dd as (select '2025-01-01'::date date_day, '2025-01-01'::date week_start union all select '2025-01-03'::date, '2025-01-01'::date) select p.id, iff(row_number() over (partition by p.uuid, dd.week_start order by created desc, p.id desc) = 1, true, false) as last_flag, case when last_flag = true then 'last' else 'not' end as label, lag(uploaded, 1, uploaded) over (partition by p.uuid order by created desc, p.id desc) as next_up, conditional_true_event(next_up != uploaded) over (partition by p.uuid order by created desc, p.id desc) as grp from p left join dd on p.d = dd.date_day order by 1"}
