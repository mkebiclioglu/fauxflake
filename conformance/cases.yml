- {id: array_agg_skips_nulls, sql: "select array_agg(x) within group (order by t), array_agg(distinct x) within group (order by x), array_agg(x), array_size(array_agg(case when x > 1 then x end) within group (order by t desc)), array_agg(x) within group (order by t) over (partition by 1) from (select column1 t, column2 x from values (1, 5), (2, null), (3, 2), (4, null)) qualify row_number() over (order by t) = 1"}
- {id: uniform_inside_cte, sql: "with a as (select cast(100 * abs(uniform(0::float, 1::float, random())) as float) v, uniform(1, 10, random()) i from table(generator(rowcount => 50))) select min(v) >= 0, max(v) <= 100, min(i) >= 1, max(i) <= 10, count(*) from a"}
# --- found by building public projects from a zero-config init
- {id: string_functions_on_variants, sql: "select right(split('12/shard_3.json', '.')[0], 1)::number as n, upper(v:a) as u, length(v:a) as l, v:a || '-z' as c, concat(v:a, 1) as c2, left(v['a'], 2) as lf, replace(v:a, 'x', 'q') as r, split_part(v:b, '.', 2) as sp, trim(v:c) as t, lower(v:n) as num from (select parse_json('{\"a\": \"xyz\", \"b\": \"x.y\", \"c\": \" x \", \"n\": 5}') v)"}
- {id: empty_key_path, sql: "select v:\"\" as e, v:a:\"\"::int as n, v:a.b[1]:\"\"::string as d from (select parse_json('{\"\": 5, \"a\": {\"\": 7, \"b\": [1, {\"\": 9}]}}') v)"}
- {id: array_agg_distinct_flattened, sql: "select t.id, array_agg(distinct c.value:columnName::text) within group (order by c.value:columnName::text) as cols, array_size(array_agg(distinct c.value:columnName::text)) as n from (select 1 id, parse_json('[{\"columnName\": \"b\"}, {\"columnName\": \"a\"}, {\"columnName\": \"b\"}, {\"x\": 1}]') v) t, lateral flatten(v) c group by 1"}
- {id: select_alias_in_join_condition, sql: "select t.k, case t.k when 'A' then 'first' else t.k end as renamed, r.rate from (select column1 k from values ('A'), ('B')) t left join (select column1 name, column2 rate from values ('first', 1.5), ('B', 2.5)) r on renamed = r.name order by 1"}
- {id: map_functions, sql: "select map_cat({'a': 1}::map(varchar, number), {'a': 2, 'c': 3}::map(varchar, number)), map_keys({'a': 1, 'b': 2}::map(varchar, number)), map_size({'a': 1}::map(varchar, number)), map_contains_key('a', {'a': 1}::map(varchar, number)), map_delete({'a': 1, 'b': 2}::map(varchar, number), 'a'), map_insert({'a': 1}::map(varchar, number), 'b', 2), map_pick({'a': 1, 'b': 2}::map(varchar, number), 'b')"}
- {id: object_delete_insert_pick, sql: "select object_delete(parse_json('{\"a\":1,\"b\":2,\"c\":3}'), 'a', 'b'), object_insert(object_construct('a', 1), 'b', 'x'), object_pick(parse_json('{\"a\":1,\"b\":2,\"c\":3}'), 'a', 'z'), object_pick(parse_json('{\"a\":1,\"b\":2}'), array_construct('b')), {} = object_construct()"}
- {id: timestamp_from_json_text, sql: "select to_timestamp_ntz(v:header:timestamp::string), to_timestamp_ntz(v:header:epoch::string), try_to_timestamp(v:header:bad::string) from (select parse_json('{\"header\": {\"timestamp\": \"2025-03-07 08:05:35.787\", \"epoch\": \"1735689600\", \"bad\": \"timestamp_ab12\"}}') v)"}
- {id: connect_by_hierarchy, sql: "with accounts as (select column1 account_id, column2 name, column3 parent_id from values (1, 'root', null), (2, 'kid', 1), (3, 'grandkid', 2), (4, 'other', null), (5, 'kid2', 1)), h as (select sys_connect_by_path(account_id, ' -> ') as path, account_id, name as account_name, parent_id, connect_by_root account_id as root_account_id, connect_by_root name as root_name, level from accounts start with parent_id is null connect by parent_id = prior account_id) select * from h where level > 1 order by path"}
- {id: connect_by_upwards, sql: "select e.name, level, connect_by_root e.name as leaf from (select column1 id, column2 name, column3 boss from values (1, 'ceo', null), (2, 'vp', 1), (3, 'eng', 2)) e start with e.id = 3 connect by prior e.boss = e.id order by level"}
- {id: parse_ip_permissive, sql: "select parse_ip('last_server_ip_abc', 'INET', 1), parse_ip('', 'INET', 1), parse_ip('1.2.3', 'INET', 1), parse_ip(null, 'INET', 1), parse_ip('10.0.0.300', 'INET', 1), parse_ip('10.1.2.3/8', 'INET', 1):ipv4_range_start, parse_ip('10.1.2.3', 'INET', 1):error is null"}
- {id: randstr_shapes, sql: "select length(randstr(32, x)), randstr(8, x) = randstr(8, x), regexp_like(randstr(40, 7), '[0-9A-Za-z]{40}'), randstr(5, random()) <> randstr(5, random()), length(sha2(randstr(32, x) || x::varchar)::varchar) from (select 5 as x)"}
