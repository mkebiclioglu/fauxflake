# Each query runs on real Snowflake once (`fauxflake conformance record`) and the
# answers are stored in golden.json. CI replays them against the emulator with no
# Snowflake access. `gap:` marks a known difference; fixing one makes its test fail
# until the marker is removed, so the list cannot go stale.
- {id: div_int, sql: "select 2/3, -2/3, 5/1000000, 7/2"}
- {id: div_decimal, sql: "select 10.55::number(12,2)/3, 1/0.3::number(3,1)"}
- {id: div_float, sql: "select 2::float/3"}
