# Copy to .github/workflows/ in your dbt repo. Needs no Snowflake credentials.
name: dbt-ci
on: pull_request
permissions:
  contents: read
  pull-requests: write   # only for the data diff comment
jobs:
  fauxflake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the diff needs the base branch
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv tool install git+https://github.com/mkebiclioglu/fauxflake
      - run: fauxflake check              # the spec covers every source column the project reads
      - run: fauxflake build              # dbt build on synthetic data
      - run: fauxflake simulate --days 14 # incrementals and snapshots stay correct as time passes
      - run: fauxflake scenarios          # no bad day corrupts data silently
      - name: data diff against the base branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.base_ref }}
        run: |
          fauxflake diff --base "$BASE" --output diff.md
          gh pr comment "$PR" --edit-last --body-file diff.md || gh pr comment "$PR" --body-file diff.md
