# Copy to .github/workflows/ in your dbt repo.
# The only job that talks to Snowflake: once a week it re-measures aggregates and
# opens a pull request. The diff is the report of how production has drifted.
name: refresh-profile
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv tool install git+https://github.com/mkebiclioglu/fauxflake@v0.1.0
      - name: profile
        env:
          # A role with SELECT on the raw schemas and an XS warehouse is enough.
          SNOWFLAKE_CONNECTIONS: ${{ secrets.SNOWFLAKE_CONNECTIONS_TOML }}
          SNOWFLAKE_DEFAULT_CONNECTION_NAME: profiler
        run: fauxflake profile --days 90 --sample-pct 5
      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: fauxflake/refresh-profile
          title: Refresh fauxflake profile from production
          commit-message: Refresh fauxflake profile from production
          body: Aggregates only. Review volume, lateness and category changes like any other diff.
